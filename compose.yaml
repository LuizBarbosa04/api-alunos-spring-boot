
services:
  postgres:
    image: postgres:16-alpine
    container_name: api-alunos-db
    environment:
      POSTGRES_DB: backend_frameworks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backend_frameworks"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: api-alunos
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/backend_frameworks
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
